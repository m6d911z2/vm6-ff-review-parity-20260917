pull_request_rules:
  - name: autoqueue all controlled PRs
    conditions:
      - -title = VM6_COMMENTED_REVIEW_PERMISSION_20260925
    actions:
      queue:
  - name: VM6 commented-review permission canary
    conditions:
      - title = VM6_COMMENTED_REVIEW_PERMISSION_20260925
      - commented-reviews-by = livastic-vm6-primary-20260911
    actions:
      label:
        add:
          - vm6-commented-review-read-fired-20260925
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/ff-ci
    max_checks_retries: 0
    merge_method: fast-forward
